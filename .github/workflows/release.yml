name: Release

on:
  push:
    tags: ["v*"]
  # Allow a dry run against the default branch without publishing.
  workflow_dispatch:

# Needed to create the GitHub Release and upload assets.
permissions:
  contents: write

jobs:
  # Release gate: a tag push triggers this workflow independently of CI, so the
  # release re-verifies itself here. Every build/publish job needs this, so
  # nothing is built, signed, or published unless these tests pass. (The slow
  # container e2e suite stays in CI on the branch push; this is the fast gate.)
  test:
    name: Test gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # -race needs cgo, so do NOT force CGO_ENABLED=0 here.
      - name: Go vet + unit + integration tests
        run: |
          go vet $(go list ./... | grep -v '/internal/integration')
          go test -race $(go list ./... | grep -v '/internal/integration')
          go test -race ./internal/integration/...
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Frontend lint + unit tests
        working-directory: web
        run: npm ci && npm run lint && npm run test
      - name: Install apk-tools build deps
        run: sudo apt-get update && sudo apt-get install -y meson ninja-build pkg-config libssl-dev zlib1g-dev
      - name: Verify apk signing round-trip
        run: ./scripts/verify-apk-signing.sh

  # Build the PWA once and share it with every arch job, so the embedded
  # frontend is identical across binaries and npm runs a single time.
  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  # apk-tools 3 (the apk package manager OpenWrt is moving to) is a build-host
  # tool, built from source like usign. Build it once and share it with every
  # packaging job so they don't each rebuild it.
  apktools:
    name: Build apk-tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install apk-tools build deps
        run: sudo apt-get update && sudo apt-get install -y meson ninja-build pkg-config libssl-dev zlib1g-dev
      - name: Build apk
        run: ./scripts/get-apk-tools.sh
      - uses: actions/upload-artifact@v4
        with:
          name: apk-tools
          path: build/apk-tools/apk
          if-no-files-found: error

  build:
    name: Build & package (${{ matrix.group }})
    runs-on: ubuntu-latest
    # Gate packaging/publishing on the tests — frontend/apktools are just prep
    # and produce no release artifacts, so they need not block on it.
    needs: [frontend, apktools, test]
    env:
      # Pure-Go (modernc.org/sqlite) so every target cross-compiles to a
      # static, glibc-free binary that runs on OpenWrt's musl userland.
      CGO_ENABLED: "0"
      GOOS: linux
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm }}
      GOMIPS: ${{ matrix.gomips }}
    strategy:
      fail-fast: false
      # One Go build per ISA group; the resulting static binary is ABI-
      # compatible across every OpenWrt subtarget in `archs`, so we repackage
      # the same binary under each CPU-tuned arch name opkg checks against.
      # `archs` covers the dominant real-world subtargets (mt7621, ipq40xx,
      # mvebu, bcm27xx/RPi, mediatek filogic, x86); other subtargets can still
      # install with `opkg install --force-architecture`.
      matrix:
        include:
          - group: x86_64
            goarch: amd64
            archs: "x86_64"
          - group: aarch64
            goarch: arm64
            archs: "aarch64_generic aarch64_cortex-a53 aarch64_cortex-a72"
          - group: armv7
            goarch: arm
            goarm: "7"
            archs: "arm_cortex-a7_neon-vfpv4 arm_cortex-a9"
          - group: mipsle
            goarch: mipsle
            gomips: softfloat
            archs: "mipsel_24kc mipsel_74kc"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Restore built frontend
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Derive version from tag
        id: ver
        # v1.2.3 -> 1.2.3; non-tag dispatch runs build a 0.0.0_git package. The
        # version must be valid for apk (stricter than opkg) — see the script.
        run: echo "version=$(./scripts/derive-version.sh)" >> "$GITHUB_OUTPUT"
      - name: Cross-compile meshd (frontend already built)
        env:
          SKIP_FRONTEND: "1"
        run: ./scripts/build.sh
      - name: Fetch apk-tools
        uses: actions/download-artifact@v4
        with:
          name: apk-tools
          path: apk-tools
      - run: chmod +x apk-tools/apk
      - name: Package .ipk and .apk per OpenWrt arch
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          APK: ${{ github.workspace }}/apk-tools/apk
          # Opt-in apk package signing: set the APK_SIGN_KEY secret (EC PEM, see
          # scripts/gen-apk-key.sh). Unset ⇒ unsigned packages.
          APK_SIGN_KEY: ${{ secrets.APK_SIGN_KEY }}
        run: |
          mkdir -p dist
          # package-ipk.sh wipes build/ipk each run, so copy each artifact out
          # before repackaging the same binary under the next arch name.
          for a in ${{ matrix.archs }}; do
            echo "::group::Packaging $a"
            ARCH="$a" VERSION="$VERSION" ./scripts/package-ipk.sh
            ARCH="$a" VERSION="$VERSION" ./scripts/package-apk.sh
            cp "build/ipk/meshd_${VERSION}_${a}.ipk" dist/
            cp "build/meshd-${VERSION}-${a}.apk" dist/
            echo "::endgroup::"
          done
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.group }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    # Only publish for real tag pushes; workflow_dispatch is a dry run.
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Collect packages
        uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true
      - name: Restore built frontend
        # luci-app-meshd bundles the PWA, so it needs the built web/dist.
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Package luci-app-meshd
        # Architecture-independent (all), built once here rather than per-arch.
        run: |
          VERSION="${GITHUB_REF_NAME#v}" ./scripts/package-luci-ipk.sh
          cp build/luci-ipk/*.ipk dist/
      - name: Build opkg feed index
        # Lets users add the release as a feed instead of downloading each .ipk:
        #   src/gz omm https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: ./scripts/make-feed-index.sh dist
      - name: Fetch apk-tools
        uses: actions/download-artifact@v4
        with:
          name: apk-tools
          path: apk-tools
      - run: chmod +x apk-tools/apk
      - name: Build signed apk feed index
        # apk counterpart of the opkg index: a (signed) packages.adb over the
        # per-arch .apk files, so the release also works as an apk feed.
        env:
          APK: ${{ github.workspace }}/apk-tools/apk
          APK_SIGN_KEY: ${{ secrets.APK_SIGN_KEY }}
        run: ./scripts/make-apk-index.sh dist
      - name: Sign feed index
        # Opt-in: only signs when the maintainer has stored a usign secret key
        # in the OPKG_SIGN_KEY secret (generate with `usign -G`; see
        # doc/openwrt.md). Without it the feed is published unsigned.
        env:
          OPKG_SIGN_KEY: ${{ secrets.OPKG_SIGN_KEY }}
        run: |
          if [ -z "${OPKG_SIGN_KEY:-}" ]; then
            echo "OPKG_SIGN_KEY not set; publishing an unsigned feed index"
            exit 0
          fi
          # usign is small and dependency-light; build it from the OpenWrt repo.
          git clone --depth 1 https://github.com/openwrt/usign /tmp/usign
          cmake -S /tmp/usign -B /tmp/usign/build >/dev/null
          make -C /tmp/usign/build >/dev/null
          umask 077
          printf '%s\n' "$OPKG_SIGN_KEY" >/tmp/usign.key
          USIGN=/tmp/usign/build/usign ./scripts/sign-feed.sh dist /tmp/usign.key
          rm -f /tmp/usign.key
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          assets=$(find dist -type f \( -name '*.ipk' -o -name '*.apk' \))
          assets="$assets dist/Packages dist/Packages.gz"
          [ -f dist/Packages.sig ] && assets="$assets dist/Packages.sig"
          # apk feed index (packages.adb is self-signed when APK_SIGN_KEY is set).
          [ -f dist/packages.adb ] && assets="$assets dist/packages.adb"
          # Publish the feeds' public keys so devices can trust them
          # (opkg-key add for usign; /etc/apk/keys/ for apk).
          [ -f package/omm-feed.pub ] && assets="$assets package/omm-feed.pub"
          [ -f package/omm-apk.pub ] && assets="$assets package/omm-apk.pub"
          echo "Attaching:"; echo "$assets"
          # Idempotent: re-running the workflow (or re-pushing the tag) must not
          # fail just because a release for this tag already exists. Create it
          # if missing, otherwise refresh its assets in place (--clobber
          # overwrites same-named files from a previous run).
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} exists; uploading assets"
            gh release upload "${GITHUB_REF_NAME}" --clobber $assets
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              $assets
          fi
