name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-unit:
    name: Go unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet $(go list ./... | grep -v '/internal/integration')
      - name: gofmt check
        run: |
          unformatted="$(gofmt -l internal meshd web)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
      - name: Unit tests
        run: go test -race $(go list ./... | grep -v '/internal/integration')

  frontend-unit:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Type-check and build
        run: npm run build

  go-integration:
    name: Go integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # In-process integration harness: spins up the real API router and UDP
      # listener on ephemeral ports and exercises them over HTTP/UDP.
      - name: Integration tests
        run: go test -race -v ./internal/integration/...

  build:
    name: Build meshd (frontend embedded)
    runs-on: ubuntu-latest
    needs: [go-unit, frontend-unit, go-integration]
    env:
      # meshd stores state in pure-Go bbolt (no CGO), so the binary is built
      # CGO-free to cross-compile cleanly for every OpenWrt target.
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Builds the PWA then compiles meshd with the assets embedded.
      - name: Build
        run: ./scripts/build.sh
      - name: Smoke test the binary
        run: |
          MESHD_HTTP_ADDR=127.0.0.1:18080 MESHD_DATABASE_PATH="$RUNNER_TEMP/smoke.db" ./bin/meshd &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl -fs http://127.0.0.1:18080/health >/dev/null; then break; fi
            sleep 0.25
          done
          curl -fs http://127.0.0.1:18080/health
          curl -fs -o /dev/null http://127.0.0.1:18080/
      - uses: actions/upload-artifact@v4
        with:
          name: meshd-binary
          path: bin/meshd
          if-no-files-found: error

  package-ipk:
    name: Package .ipk
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: meshd-binary
          path: bin
      - name: Build ipk
        run: ./scripts/package-ipk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: meshd-ipk
          path: build/ipk/*.ipk
          if-no-files-found: error

  package-apk:
    name: Package .apk
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: meshd-binary
          path: bin
      - name: Build apk
        run: ./scripts/package-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: meshd-apk
          path: build/*.apk
          if-no-files-found: error

  e2e:
    name: E2E (OpenWrt containers)
    runs-on: ubuntu-latest
    needs: [go-unit, go-integration]
    env:
      # The binary must be static (no glibc) to run on OpenWrt's musl userland
      # inside the container images.
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build static binary and OpenWrt packages
        run: |
          SKIP_FRONTEND=1 ./scripts/build.sh
          ./scripts/package-ipk.sh
          ./scripts/package-apk.sh
      # ubuntu-latest ships Docker, so testcontainers connects automatically.
      - name: Run end-to-end tests
        run: go test -tags e2e -timeout 25m -v ./internal/e2e/...
